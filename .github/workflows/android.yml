name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'icon.svg', 'manifest.webmanifest', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: summarise-me-preview-signing-v1
      - name: Bundle app interface
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon.svg manifest.webmanifest android/app/src/main/assets/
      - name: Compile Android APK and lint
        run: gradle -p android :app:assembleDebug :app:lintDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Summarise-Me.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Summarise-Me-Android
          path: Summarise-Me.apk
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-preview >/dev/null 2>&1 || gh release create android-preview --title 'Summarise Me for Android — preview' --prerelease --notes 'Installable Android preview with native background microphone recording and notification controls. Allow microphone and notification permissions. Web/PWA notes are stored separately from this Android app. Device testing is still required.'
          gh release upload android-preview Summarise-Me.apk --clobber

plugins { id 'com.android.application' }
android {
 namespace 'me.summariseme.app'
 compileSdk 35
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'me.summariseme.app'; minSdk 26; targetSdk 35; versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'); versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1') }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { debug { if (System.getenv('SUMMARISE_SIGNING_STORE')) { storeFile file(System.getenv('SUMMARISE_SIGNING_STORE')); storePassword 'android'; keyAlias 'AndroidDebugKey'; keyPassword 'android' } } }
 buildTypes { debug { debuggable true } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'androidx.core:core:1.15.0' }
